name: Interface rate regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: perl -c check_snmp_netint.pl
      - run: python3 -m unittest discover -s tests -p test_netint_rates.py -v
